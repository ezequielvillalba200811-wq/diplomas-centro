<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Diploma - Centro Constitución</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: #ddd;
  font-family: Arial, sans-serif;
}

.toolbar {
  background: #111;
  padding: 12px;
  text-align: center;
}

.toolbar button {
  border: 0;
  border-radius: 8px;
  padding: 11px 20px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.wrapper {
  width: 100%;
  overflow-x: auto;
  padding: 15px 0;
}

.sheet {
  position: relative;
  width: 1123px;
  height: 794px;
  margin: 0 auto;

  background-image: url('/template-diploma.jpeg');
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  overflow: hidden;
}

/* =========================
   ALUMNO
========================= */

.student {
  position: absolute;

  top: 350px;
  left: 150px;
  width: 823px;

  text-align: center;

  font-size: 34px;
  line-height: 1;

  font-weight: 800;
  text-transform: uppercase;

  white-space: nowrap;
}

/* =========================
   CURSO
========================= */

.course {
  position: absolute;

  top: 510px;
  left: 135px;
  width: 853px;

  text-align: center;

  font-size: 30px;
  line-height: 1;

  font-weight: 900;
  text-transform: uppercase;
}

/* =========================
   FECHA
========================= */

.date-day {
  position: absolute;

  top: 594px;
  left: 602px;

  width: 40px;

  text-align: center;

  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: 700;
  font-style: italic;
}

.date-month {
  position: absolute;

  top: 594px;
  left: 675px;

  width: 165px;

  text-align: center;

  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: 700;
  font-style: italic;

  background: white;
}

.date-year {
  position: absolute;

  top: 594px;
  left: 893px;

  width: 75px;

  text-align: center;

  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: 700;
  font-style: italic;

  background: white;
}

/* =========================
   PROFESORA
========================= */

.professor {
  position: absolute;

  top: 655px;
  left: 70px;

  width: 300px;

  text-align: center;

  font-size: 21px;
  line-height: 1;

  font-weight: 700;

  white-space: nowrap;
}

/* =========================
   DIRECTOR
========================= */

.director {
  position: absolute;

  top: 655px;
  right: 70px;

  width: 300px;

  text-align: center;

  font-size: 21px;
  line-height: 1;

  font-weight: 700;

  white-space: nowrap;
}

/* =========================
   QR
========================= */

.qr {
  position: absolute;

  top: 42px;
  right: 48px;

  width: 145px;
  height: 145px;

  background: white;
}

.qr img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;
}

/* =========================
   CÓDIGO
========================= */

.code {
  position: absolute;

  bottom: 15px;
  left: 411px;

  width: 300px;

  text-align: center;

  font-size: 13px;
  color: #444;
}

/* =========================
   IMPRESIÓN
========================= */

@page {
  size: A4 landscape;
  margin: 0;
}

@media print {

  body {
    background: white;
  }

  .toolbar {
    display: none;
  }

  .wrapper {
    padding: 0;
    overflow: visible;
  }

  .sheet {
    width: 297mm;
    height: 210mm;
    margin: 0;
  }
}

</style>
</head>

<body>

<div class="toolbar">

  <button onclick="window.print()">
    Imprimir / Guardar PDF
  </button>

</div>

<div class="wrapper">

  <div class="sheet">

    <div
      class="student"
      id="student">
    </div>

    <div
      class="course"
      id="course">
    </div>

    <div
      class="date-day"
      id="dateDay">
    </div>

    <div
      class="date-month"
      id="dateMonth">
    </div>

    <div
      class="date-year"
      id="dateYear">
    </div>

    <div
      class="professor"
      id="professor">
    </div>

    <div
      class="director"
      id="director">
    </div>

    <div class="qr">

      <img
        id="qr"
        alt="Código QR">

    </div>

    <div
      class="code"
      id="code">
    </div>

  </div>

</div>

<script>

(async () => {

  const id =
    location.pathname
      .split('/')
      .pop();

  const response =
    await fetch(
      '/api/certificados/' + id
    );

  const certificado =
    await response.json();

  if (!response.ok) {

    document.body.innerHTML =
      '<h1 style="text-align:center">Diploma no encontrado</h1>';

    return;
  }

  /* ALUMNO */

  document
    .getElementById('student')
    .textContent =
      certificado.alumno;

  /* CURSO */

  document
    .getElementById('course')
    .textContent =
      certificado.curso;

  /* FECHA */

  const [
    year,
    month,
    day
  ] =
    certificado.fecha
      .split('-')
      .map(Number);

  const fecha =
    new Date(
      year,
      month - 1,
      day
    );

  const nombreMes =
    fecha.toLocaleDateString(
      'es-AR',
      {
        month: 'long'
      }
    );

  document
    .getElementById('dateDay')
    .textContent =
      String(day).padStart(2, '0');

  document
    .getElementById('dateMonth')
    .textContent =
      nombreMes;

  document
    .getElementById('dateYear')
    .textContent =
      year;

  /* PROFESORA */

  document
    .getElementById('professor')
    .textContent =
      certificado.profesor;

  /* DIRECTOR */

  document
    .getElementById('director')
    .textContent =
      certificado.director;

  /* QR */

  document
    .getElementById('qr')
    .src =
      certificado.qr;

  /* CÓDIGO */

  document
    .getElementById('code')
    .textContent =
      certificado.codigo;

})();

</script>

</body>
</html>
