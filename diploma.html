<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Diploma - Centro Constitución</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: #ddd;
  font-family: Arial, sans-serif;
}

.toolbar {
  background: #111;
  padding: 12px;
  text-align: center;
}

.toolbar button {
  border: 0;
  border-radius: 8px;
  padding: 11px 20px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.wrapper {
  width: 100%;
  overflow-x: auto;
  padding: 15px 0;
}

.sheet {
  position: relative;
  width: 1123px;
  height: 794px;
  margin: 0 auto;

  background:
    url('/template-diploma.jpeg')
    center / 100% 100%
    no-repeat;

  overflow: hidden;
}

/* NOMBRE */

.student {
  position: absolute;
  top: 340px;
  left: 150px;
  width: 823px;

  text-align: center;
  font-size: 36px;
  line-height: 1.05;
  font-weight: 800;
  text-transform: uppercase;
}

/* CURSO */

.course {
  position: absolute;
  top: 515px;
  left: 150px;
  width: 823px;

  text-align: center;
  font-size: 31px;
  line-height: 1.05;
  font-weight: 900;
  text-transform: uppercase;
}

/* FECHA: solo ponemos la fecha nueva */

.citydate {
  position: absolute;
  top: 606px;
  left: 525px;
  width: 390px;

  text-align: left;
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  font-style: italic;

  background: #fff;
  padding: 2px 6px;
}

/* NOMBRE PROFESORA */

.professor {
  position: absolute;
  top: 667px;
  left: 85px;
  width: 285px;

  text-align: center;
  font-size: 22px;
  font-weight: 700;
}

/* NOMBRE DIRECTOR */

.director {
  position: absolute;
  top: 667px;
  right: 85px;
  width: 285px;

  text-align: center;
  font-size: 22px;
  font-weight: 700;
}

/* QR */

.qr {
  position: absolute;
  top: 42px;
  right: 48px;

  width: 145px;
  height: 145px;

  background: white;
}

.qr img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

/* CÓDIGO ÚNICO */

.code {
  position: absolute;
  bottom: 15px;
  left: 411px;
  width: 300px;

  text-align: center;
  font-size: 13px;
  color: #444;
}

@page {
  size: A4 landscape;
  margin: 0;
}

@media print {

  body {
    background: white;
  }

  .toolbar {
    display: none;
  }

  .wrapper {
    padding: 0;
    overflow: visible;
  }

  .sheet {
    width: 297mm;
    height: 210mm;
    margin: 0;
    box-shadow: none;
  }
}

</style>
</head>

<body>

<div class="toolbar">
  <button onclick="window.print()">
    Imprimir / Guardar PDF
  </button>
</div>

<div class="wrapper">

  <div class="sheet">

    <div
      class="student"
      id="student">
    </div>

    <div
      class="course"
      id="course">
    </div>

    <div
      class="citydate"
      id="citydate">
    </div>

    <div
      class="professor"
      id="professor">
    </div>

    <div
      class="director"
      id="director">
    </div>

    <div class="qr">
      <img id="qr" alt="QR">
    </div>

    <div
      class="code"
      id="code">
    </div>

  </div>

</div>

<script>

(async () => {

  const id =
    location.pathname
      .split('/')
      .pop();

  const response =
    await fetch(
      '/api/certificados/' + id
    );

  const certificado =
    await response.json();

  if (!response.ok) {

    document.body.innerHTML =
      '<h1 style="text-align:center">Diploma no encontrado</h1>';

    return;
  }

  /* ALUMNO */

  document
    .getElementById('student')
    .textContent =
      certificado.alumno;

  /* CURSO */

  document
    .getElementById('course')
    .textContent =
      certificado.curso;

  /* FECHA */

  const [anio, mes, dia] =
    certificado.fecha
      .split('-')
      .map(Number);

  const fecha =
    new Date(
      anio,
      mes - 1,
      dia
    );

  const nombreMes =
    fecha.toLocaleDateString(
      'es-AR',
      {
        month: 'long'
      }
    );

  document
    .getElementById('citydate')
    .textContent =
      `${String(dia).padStart(2, '0')} de ${nombreMes} de ${anio}`;

  /* PROFESORA */

  document
    .getElementById('professor')
    .textContent =
      certificado.profesor;

  /* DIRECTOR */

  document
    .getElementById('director')
    .textContent =
      certificado.director;

  /* QR */

  document
    .getElementById('qr')
    .src =
      certificado.qr;

  /* CÓDIGO */

  document
    .getElementById('code')
    .textContent =
      certificado.codigo;

})();

</script>

</body>
</html>
