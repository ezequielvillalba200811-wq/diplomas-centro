<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Certificado - Centro Constitución</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #e7e7e7;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       PANEL
    ========================== */

    .panel {
      max-width: 1100px;
      margin: 0 auto 20px;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
    }

    .panel h2 {
      margin: 0 0 20px;
    }

    .campos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo label {
      font-size: 14px;
      font-weight: 700;
    }

    .campo input,
    .campo select {
      width: 100%;
      height: 44px;
      padding: 10px 12px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 16px;
      background: #fff;
    }

    .botones {
      margin-top: 18px;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    /* =========================
       VISTA
    ========================== */

    .vista {
      width: 100%;
      overflow-x: auto;
    }

    /* =========================
       CERTIFICADO A4 HORIZONTAL
    ========================== */

    .certificado {
      position: relative;

      width: 297mm;
      height: 210mm;

      margin: 0 auto;

      background-color: #fff;

      background-image: url("/fondo-certificado.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;

      overflow: hidden;
    }

    /* =========================
       ALUMNO
    ========================== */

    .alumno {
      position: absolute;

      top: 39.5%;
      left: 7%;

      width: 86%;

      text-align: center;

      font-size: 10mm;
      font-weight: 900;

      text-transform: uppercase;

      line-height: 1.05;
    }

    /* =========================
       QR ARRIBA A LA DERECHA
    ========================== */

    .qr-certificado {
      position: absolute;

      top: 5%;
      right: 4%;

      width: 27mm;
      height: 27mm;

      background: #fff;

      padding: 2mm;

      z-index: 20;

      display: none;
    }

    .qr-certificado img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }

    /* =========================
       CURSO
    ========================== */

    .curso {
      position: absolute;

      top: 62%;
      left: 5%;

      width: 90%;

      text-align: center;

      font-size: 8.5mm;
      font-weight: 900;

      text-transform: uppercase;

      line-height: 1.05;
    }

    /* =========================
       FECHA

       IMPORTANTE:
       solo mostramos la fecha,
       no repetimos "Ciudad Autónoma..."
    ========================== */

    .fecha {
      position: absolute;

      top: 72.4%;
      left: 42%;

      width: 45%;

      text-align: center;

      font-size: 5.4mm;
      font-weight: 700;

      white-space: nowrap;

      background: #fff;
    }

    /* =========================
       PROFESOR/A

       Se coloca sobre el lugar
       correspondiente sin volver
       a crear líneas.
    ========================== */

    .firma-profesor {
      position: absolute;

      bottom: 8.5%;
      left: 5%;

      width: 34%;

      text-align: center;
    }

    .texto-firma {
      font-size: 5.5mm;
      font-weight: 700;

      white-space: nowrap;

      background: #fff;

      display: inline-block;

      padding: 1mm 2mm;
    }

    /* =========================
       CELULAR
    ========================== */

    @media (max-width: 700px) {

      .campos {
        grid-template-columns: 1fr;
      }

      .certificado {
        transform-origin: top left;
      }

    }

    /* =========================
       IMPRESIÓN
    ========================== */

    @media print {

      @page {
        size: A4 landscape;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 297mm;
        height: 210mm;

        background: #fff;
      }

      .panel {
        display: none !important;
      }

      .vista {
        width: 297mm;
        height: 210mm;

        overflow: hidden;
      }

      .certificado {
        width: 297mm;
        height: 210mm;

        margin: 0;

        page-break-after: avoid;
        page-break-inside: avoid;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       PANEL
  ========================== -->

  <div class="panel">

    <h2>Crear certificado</h2>

    <div class="campos">

      <div class="campo">

        <label for="alumnoInput">
          Nombre y apellido del alumno
        </label>

        <input
          id="alumnoInput"
          type="text"
          placeholder="Ej: Gloria López"
        >

      </div>


      <div class="campo">

        <label for="cursoInput">
          Curso
        </label>

        <input
          id="cursoInput"
          type="text"
          placeholder="Ej: Barbería nivel inicial"
        >

      </div>


      <div class="campo">

        <label for="fechaInput">
          Fecha
        </label>

        <input
          id="fechaInput"
          type="text"
          placeholder="Ej: 7 de septiembre de 2026"
        >

      </div>


      <div class="campo">

        <label for="profesorInput">
          Nombre del profesor/a
        </label>

        <input
          id="profesorInput"
          type="text"
          value="Matus Acosta"
          placeholder="Ej: Matus Acosta"
        >

      </div>


      <div class="campo">

        <label for="cargoInput">
          Profesor o Profesora
        </label>

        <select id="cargoInput">

          <option value="Profesora">
            Profesora
          </option>

          <option value="Profesor">
            Profesor
          </option>

        </select>

      </div>

    </div>


    <div class="botones">

      <button
        type="button"
        id="imprimirBtn"
      >
        Imprimir / Guardar PDF
      </button>

    </div>

  </div>


  <!-- =========================
       CERTIFICADO
  ========================== -->

  <div class="vista">

    <div
      class="certificado"
      id="certificado"
    >

      <!-- QR ARRIBA DERECHA -->

      <div
        class="qr-certificado"
        id="qrContenedor"
      >

        <img
          id="qrCertificado"
          alt="QR del certificado"
        >

      </div>


      <!-- ALUMNO -->

      <div
        class="alumno"
        id="alumnoCertificado"
      ></div>


      <!-- CURSO -->

      <div
        class="curso"
        id="cursoCertificado"
      ></div>


      <!-- FECHA -->

      <div
        class="fecha"
        id="fechaCertificado"
      ></div>


      <!-- PROFESOR/A -->

      <div class="firma-profesor">

        <div
          class="texto-firma"
          id="profesorCertificado"
        ></div>

      </div>

    </div>

  </div>


  <script>

    const alumnoInput =
      document.getElementById("alumnoInput");

    const cursoInput =
      document.getElementById("cursoInput");

    const fechaInput =
      document.getElementById("fechaInput");

    const profesorInput =
      document.getElementById("profesorInput");

    const cargoInput =
      document.getElementById("cargoInput");


    const alumnoCertificado =
      document.getElementById("alumnoCertificado");

    const cursoCertificado =
      document.getElementById("cursoCertificado");

    const fechaCertificado =
      document.getElementById("fechaCertificado");

    const profesorCertificado =
      document.getElementById("profesorCertificado");

    const qrCertificado =
      document.getElementById("qrCertificado");

    const qrContenedor =
      document.getElementById("qrContenedor");


    /* =========================
       ALUMNO
    ========================== */

    function actualizarAlumno() {

      alumnoCertificado.textContent =
        alumnoInput.value.trim();

    }


    /* =========================
       CURSO
    ========================== */

    function actualizarCurso() {

      cursoCertificado.textContent =
        cursoInput.value.trim();

    }


    /* =========================
       FECHA
    ========================== */

    function actualizarFecha() {

      const fecha =
        fechaInput.value.trim();

      fechaCertificado.textContent =
        fecha;

    }


    /* =========================
       PROFESOR/A
    ========================== */

    function actualizarProfesor() {

      const nombre =
        profesorInput.value.trim();

      const cargo =
        cargoInput.value;

      if (!nombre) {

        profesorCertificado.textContent = "";

        return;

      }

      profesorCertificado.textContent =
        nombre + ": " + cargo;

    }


    /* =========================
       EVENTOS
    ========================== */

    alumnoInput.addEventListener(
      "input",
      actualizarAlumno
    );

    cursoInput.addEventListener(
      "input",
      actualizarCurso
    );

    fechaInput.addEventListener(
      "input",
      actualizarFecha
    );

    profesorInput.addEventListener(
      "input",
      actualizarProfesor
    );

    cargoInput.addEventListener(
      "change",
      actualizarProfesor
    );


    /* =========================
       DATOS DESDE URL
    ========================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    if (params.get("alumno")) {

      alumnoInput.value =
        params.get("alumno");

    }


    if (params.get("curso")) {

      cursoInput.value =
        params.get("curso");

    }


    if (params.get("fecha")) {

      fechaInput.value =
        params.get("fecha");

    }


    if (params.get("profesor")) {

      profesorInput.value =
        params.get("profesor");

    }


    if (params.get("cargo")) {

      const cargo =
        params.get("cargo");

      if (
        cargo === "Profesor" ||
        cargo === "Profesora"
      ) {

        cargoInput.value =
          cargo;

      }

    }


    /* =========================
       QR

       Acepta:
       ?qr=...
       o
       ?qrUrl=...
    ========================== */

    const qr =
      params.get("qr") ||
      params.get("qrUrl");

    if (qr) {

      qrCertificado.src =
        decodeURIComponent(qr);

      qrContenedor.style.display =
        "block";

    }


    /* =========================
       MOSTRAR DATOS
    ========================== */

    actualizarAlumno();
    actualizarCurso();
    actualizarFecha();
    actualizarProfesor();


    /* =========================
       IMPRIMIR
    ========================== */

    document
      .getElementById("imprimirBtn")
      .addEventListener(
        "click",
        function () {

          window.print();

        }
      );

  </script>

</body>
</html>
