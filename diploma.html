<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diploma</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#ddd;font-family:Arial,sans-serif}
  .toolbar{padding:12px;text-align:center;background:#111;position:sticky;top:0;z-index:5}
  .toolbar button{padding:10px 18px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
  .sheet{
    position:relative;width:297mm;height:210mm;margin:18px auto;background:white center/100% 100% no-repeat;
    box-shadow:0 6px 25px #0003;overflow:hidden
  }
  .student,.course,.citydate,.professor,.director,.code,.qr{position:absolute;text-align:center}
  .student{top:39.8%;left:17%;width:66%;font-size:10mm;font-weight:800;text-transform:uppercase;line-height:1.05}
  .course{top:63.6%;left:7.5%;width:85%;font-size:8.7mm;font-weight:900;text-transform:uppercase;line-height:1}
  .citydate{top:72.6%;left:9%;width:82%;font-size:5.5mm;font-weight:700;font-style:italic}
  .professor{left:5.5%;bottom:5.7%;width:26%;font-size:5.6mm;font-weight:700;line-height:1.15}
  .director{right:5.5%;bottom:5.7%;width:26%;font-size:5.6mm;font-weight:700;line-height:1.15}
  .code{left:38%;bottom:2.5%;width:24%;font-size:3.2mm;color:#444}
  .qr{right:5.6%;top:4.1%;width:16.2%;height:20%}
  .qr img{width:100%;height:100%;object-fit:contain}
  @page{size:A4 landscape;margin:0}
  @media print{
    body{background:#fff}
    .toolbar{display:none}
    .sheet{margin:0;box-shadow:none}
  }
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">Imprimir / Guardar PDF</button></div>
<div class="sheet" id="sheet">
  <div class="student" id="student"></div>
  <div class="course" id="course"></div>
  <div class="citydate" id="citydate"></div>
  <div class="professor" id="professor"></div>
  <div class="director" id="director"></div>
  <div class="code" id="code"></div>
  <div class="qr"><img id="qr"></div>
</div>

<script>
(async () => {
  const id = location.pathname.split('/').pop();
  const r = await fetch('/api/certificados/' + id);
  const x = await r.json();
  if (!r.ok) return document.body.innerHTML = '<h1>Diploma no encontrado</h1>';

  document.getElementById('sheet').style.backgroundImage = "url('/template-diploma.jpeg')";
  document.getElementById('student').textContent = x.alumno;
  document.getElementById('course').textContent = x.curso;

  const [y,m,d] = x.fecha.split('-').map(Number);
  const fecha = new Date(y,m-1,d).toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('citydate').textContent = 'Ciudad Autónoma de Buenos Aires,   ' + fecha + '.';

  document.getElementById('professor').innerHTML = escapeHtml(x.profesor) + '<br>Profesor/a';
  document.getElementById('director').innerHTML = escapeHtml(x.director) + '<br>Director/a';
  document.getElementById('code').textContent = x.codigo;
  document.getElementById('qr').src = x.qr;

  function escapeHtml(v='') {
    return String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
})();
</script>
</body>
</html>
