<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificación de certificado</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#18181b}
.wrap{max-width:850px;margin:40px auto;padding:0 18px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 6px 24px #00000012;margin-bottom:18px}
.ok{display:inline-block;background:#dcfce7;color:#166534;padding:7px 10px;border-radius:999px;font-weight:700}
h1,h2{margin-top:0}.row{padding:9px 0;border-bottom:1px solid #eee}.label{font-size:12px;color:#71717a;text-transform:uppercase;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="cert"></div>
  <div class="card">
    <h2 id="tituloCurso">Egresados del curso</h2>
    <div id="lista"></div>
  </div>
</div>
<script>
(async()=>{
  const id = location.pathname.split('/').pop();
  const r = await fetch('/api/certificados/' + id);
  const x = await r.json();
  if (!r.ok) return document.getElementById('cert').innerHTML = '<h1>Certificado no encontrado</h1>';

  document.getElementById('cert').innerHTML = `
    <span class="ok">✓ Certificado válido</span>
    <h1>Centro Constitución</h1>
    <div class="row"><div class="label">Alumno</div><strong>${e(x.alumno)}</strong></div>
    <div class="row"><div class="label">Curso</div>${e(x.curso)}</div>
    <div class="row"><div class="label">Profesor/a</div>${e(x.profesor)}</div>
    <div class="row"><div class="label">Director/a</div>${e(x.director)}</div>
    <div class="row"><div class="label">Fecha</div>${e(x.fecha)}</div>
    <div class="row"><div class="label">Código</div>${e(x.codigo)}</div>`;

  document.getElementById('tituloCurso').textContent = 'Egresados: ' + x.curso;
  const rr = await fetch('/api/curso/' + x.curso_slug);
  const list = await rr.json();
  document.getElementById('lista').innerHTML = `
    <table><thead><tr><th>Alumno</th><th>Fecha</th><th>Código</th></tr></thead>
    <tbody>${list.map(a=>`<tr><td>${e(a.alumno)}</td><td>${e(a.fecha)}</td><td>${e(a.codigo)}</td></tr>`).join('')}</tbody></table>`;

  function e(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
})();
</script>
</body>
</html>
